name: Publish and check source
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 15 * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check KICT source without modifying the catalog
        id: source_check
        continue-on-error: true
        run: python scripts/check_kict.py
      - name: Save check status
        if: steps.source_check.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record KICT inventory check'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Signal check failure
        if: steps.source_check.outcome == 'failure'
        run: exit 1
