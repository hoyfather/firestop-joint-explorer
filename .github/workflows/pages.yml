name: Monthly catalogue update
# 연구원(KICT) 내화채움구조 전체 인정현황을 매월 점검해 이 저장소의 데이터
# (index.html 의 DATA, docs/*.pdf, rows/*.png, update-status.json)를 갱신합니다.
# 사내 공유본은 같은 날 오후 Claude 예약 작업이 이 결과를 받아 반영합니다.
# GitHub Pages 공개 배포는 하지 않습니다.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 15 * *'   # 매월 15일 10:17 KST (정각 혼잡 시간대 회피)
permissions:
  contents: write
concurrency:
  group: catalogue-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install pdfplumber==0.11.7 pymupdf==1.26.5
      - name: Refresh from official source
        run: python scripts/update.py
      - name: Save verified catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html update-status.json baseline-inventory.json docs/ rows/
          if ! git diff --cached --quiet; then
            git commit -m 'Update KICT firestop catalogue'
            git push origin HEAD:main
          fi
