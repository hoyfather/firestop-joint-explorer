name: Publish and update catalogue
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 15 * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        if: github.event_name != 'push'
        run: pip install pdfplumber==0.11.7 pymupdf==1.26.5
      - name: Refresh from official source
        if: github.event_name != 'push'
        run: python scripts/update.py
      - name: Save verified catalogue
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html update-status.json baseline-inventory.json docs/ rows/
          if ! git diff --cached --quiet; then
            git commit -m 'Update KICT firestop catalogue'
            git push origin HEAD:main
          fi
      - name: Prepare PDF viewer
        run: python scripts/prepare_pdfjs.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
