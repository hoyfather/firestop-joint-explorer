name: Recover PDF files from official archives
on:
  push:
    branches: [prepare-scheduled-refresh]
    paths: ['.github/workflows/repair-zip.yml', 'scripts/repair_zip_pdfs.py']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prepare-scheduled-refresh
      - run: pip install pdfplumber==0.11.7 pymupdf==1.26.5
      - run: python scripts/repair_zip_pdfs.py
      - name: Commit checksum-verified files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m 'Restore PDFs from official archives'
            git push origin HEAD:prepare-scheduled-refresh
          fi
