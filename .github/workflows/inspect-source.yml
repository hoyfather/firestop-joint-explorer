name: Inspect official attachments
on:
  push:
    branches: [prepare-scheduled-refresh]
    paths: ['.github/workflows/inspect-source.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List file names in notices
        run: |
          python - <<'PY'
          import sys, re
          sys.path.insert(0,'scripts')
          from check_kict import read
          for ident in ('5029','5623'):
              html=read('https://www.kict.re.kr/governmentWeb/getGovernmentContentsView.es?mid=a10602050000&pid=83&id='+ident).decode('utf8')
              print(ident, re.findall(r"egov_download_atchfile\('government',\s*'[^']*',\s*'([^']*)',\s*'([^']*)'\)",html))
          PY
